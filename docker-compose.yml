services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-wardizitto}
      MYSQL_USER: ${DB_USER:-wardizitto}
      MYSQL_PASSWORD: ${DB_PASSWORD:?configure DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?configure MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
